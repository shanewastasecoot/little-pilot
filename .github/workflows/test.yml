# Runs ./dev.sh check and ./dev.sh test on every push and pull request.
# See "How CI works" in README.md.
name: Tests

on:
  push:
  pull_request:

# Keep in step with the version pinned in README.md (checked below).
env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Big files (models, textures) live in Git LFS. Check out WITHOUT them
      # first, then fetch them through a cache so CI doesn't download the
      # same files from GitHub's LFS storage on every run.
      - name: Check out (no LFS yet)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: List the LFS files (cache key)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore the LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Fetch and check out the LFS files
        run: |
          git lfs pull
          git lfs checkout

      - name: No LFS pointer files left
        run: |
          # A file still starting with this line is a pointer, not the real asset.
          pointers=$(git lfs ls-files -n | while read -r f; do
            if head -c 40 "$f" | grep -q "version https://git-lfs"; then echo "$f"; fi
          done)
          if [ -n "$pointers" ]; then
            echo "These files are still LFS pointers:"; echo "$pointers"; exit 1
          fi

      - name: The pinned Godot version matches README.md
        run: grep -q "Godot ${GODOT_VERSION} stable" README.md

      - name: Install Godot ${{ env.GODOT_VERSION }} (standard, not .NET)
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL -o godot.zip "$url"
          unzip -q godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: ./dev.sh check
        run: ./dev.sh check

      - name: ./dev.sh test
        run: ./dev.sh test
